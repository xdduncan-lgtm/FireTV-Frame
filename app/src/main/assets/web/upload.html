<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Send photos to your TV</title>
<style>
  :root{--bg:#f4f2ee;--card:#fff;--ink:#1d1c1a;--muted:#6f6b63;--line:#e3dfd7;--accent:#3d5a4c;--accentInk:#fff;--ok:#2f6b46;--err:#a23b3b}
  @media (prefers-color-scheme: dark){:root{color-scheme:dark;--bg:#151514;--card:#1f1e1c;--ink:#f1efea;--muted:#a19d94;--line:#33312d;--accent:#cdb98f;--accentInk:#1b1a17;--ok:#8fc7a1;--err:#e7a3a3}}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    padding:calc(env(safe-area-inset-top,0px) + 28px) 20px calc(env(safe-area-inset-bottom,0px) + 28px)}
  main{max-width:520px;margin:0 auto}
  .frame{width:56px;height:40px;border:4px solid var(--accent);box-shadow:inset 0 0 0 5px var(--card),inset 0 0 0 12px var(--line);margin-bottom:18px}
  h1{font-family:Georgia,"Times New Roman",serif;font-weight:400;font-size:30px;line-height:1.15}
  p.lead{color:var(--muted);margin-top:8px}
  .pick{display:block;margin-top:24px;padding:18px;border-radius:14px;background:var(--card);border:1.5px dashed var(--line);text-align:center;font-weight:600;cursor:pointer}
  .pick input{display:none}
  .list{margin-top:18px;display:grid;grid-template-columns:repeat(3,1fr);grid-gap:8px}
  .item{position:relative;border-radius:8px;overflow:hidden;background:var(--line);height:100px}
  .item img{width:100%;height:100%;object-fit:cover;display:block}
  .item .st{position:absolute;left:0;right:0;bottom:0;font-size:12px;padding:3px 6px;background:rgba(0,0,0,.55);color:#fff}
  .item.done .st{background:rgba(47,107,70,.85)}
  .item.fail .st{background:rgba(162,59,59,.9)}
  .bar{position:absolute;left:0;top:0;height:3px;background:var(--accent);width:0;transition:width .2s}
  button.send{width:100%;margin-top:20px;padding:16px;border:0;border-radius:14px;background:var(--accent);color:var(--accentInk);font:600 17px/1 inherit;font-family:inherit}
  button.send:disabled{opacity:.45}
  .msg{margin-top:14px;min-height:24px;color:var(--muted)}
  .msg.ok{color:var(--ok)} .msg.err{color:var(--err)}
  .tip{margin-top:28px;font-size:14px;color:var(--muted);border-top:1px solid var(--line);padding-top:16px}
</style>
</head>
<body>
<main>
  <div class="frame" aria-hidden="true"></div>
  <h1>Send photos to your TV</h1>
  <p class="lead">They appear under My Photos in Art Mode, ready to frame with a mat.</p>

  <label class="pick">Choose photos
    <input id="file" type="file" accept="image/*" multiple>
  </label>

  <div class="list" id="list"></div>
  <button class="send" id="send" disabled>Send to TV</button>
  <div class="msg" id="msg"></div>

  <p class="tip">Photos are resized to 4K before sending, so large pictures transfer quickly. Everything stays on your home network.</p>
</main>
<script>
(function () {
  var file = document.getElementById('file'), list = document.getElementById('list'),
      send = document.getElementById('send'), msg = document.getElementById('msg'), queue = [];

  file.addEventListener('change', function () {
    queue = [];
    list.innerHTML = '';
    Array.prototype.forEach.call(file.files, function (f) {
      var el = document.createElement('div'); el.className = 'item';
      var img = document.createElement('img'); img.src = URL.createObjectURL(f); img.alt = '';
      var st = document.createElement('div'); st.className = 'st'; st.textContent = 'Ready';
      var bar = document.createElement('div'); bar.className = 'bar';
      el.appendChild(img); el.appendChild(bar); el.appendChild(st); list.appendChild(el);
      queue.push({ file: f, el: el, st: st, bar: bar });
    });
    send.disabled = !queue.length;
    send.textContent = queue.length ? 'Send ' + queue.length + ' photo' + (queue.length > 1 ? 's' : '') + ' to TV' : 'Send to TV';
    msg.textContent = ''; msg.className = 'msg';
  });

  // Resize to at most 3840px and bake in rotation; falls back to the original file.
  function prepare(f) {
    return new Promise(function (resolve) {
      var url = URL.createObjectURL(f), img = new Image();
      img.onload = function () {
        var max = 3840, w = img.naturalWidth, h = img.naturalHeight, s = Math.min(1, max / Math.max(w, h));
        var c = document.createElement('canvas');
        c.width = Math.round(w * s); c.height = Math.round(h * s);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        c.toBlob(function (b) { resolve(b ? { blob: b, name: 'photo.jpg' } : { blob: f, name: f.name }); }, 'image/jpeg', 0.9);
      };
      img.onerror = function () { URL.revokeObjectURL(url); resolve({ blob: f, name: f.name }); };
      img.src = url;
    });
  }

  function upload(q) {
    return prepare(q.file).then(function (p) {
      return new Promise(function (resolve) {
        var fd = new FormData(); fd.append('photo', p.blob, p.name);
        var x = new XMLHttpRequest();
        x.open('POST', '/upload');
        x.upload.onprogress = function (e) { if (e.lengthComputable) q.bar.style.width = (100 * e.loaded / e.total) + '%'; };
        x.onload = function () {
          var ok = x.status >= 200 && x.status < 300;
          q.el.classList.add(ok ? 'done' : 'fail');
          q.st.textContent = ok ? 'On your TV' : (x.responseText || 'Failed');
          resolve(ok);
        };
        x.onerror = function () { q.el.classList.add('fail'); q.st.textContent = 'TV not reachable'; resolve(false); };
        q.st.textContent = 'Sending…';
        x.send(fd);
      });
    });
  }

  send.addEventListener('click', function () {
    send.disabled = true;
    var ok = 0, i = 0, items = queue.slice();
    msg.className = 'msg'; msg.textContent = 'Sending…';
    (function next() {
      if (i >= items.length) {
        var fail = items.length - ok;
        msg.className = 'msg ' + (fail ? 'err' : 'ok');
        msg.textContent = fail ? ok + ' sent, ' + fail + ' failed. Check that the TV app is open and try again.'
                               : 'Done. ' + ok + ' photo' + (ok > 1 ? 's are' : ' is') + ' on your TV.';
        queue = []; file.value = '';
        return;
      }
      upload(items[i++]).then(function (r) { if (r) ok++; next(); });
    })();
  });
})();
</script>
</body>
</html>
